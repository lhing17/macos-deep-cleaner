[package]
name = "mdc-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "mdc"
path = "src/main.rs"

[dependencies]
mdc-core = { path = "../mdc-core" }
mdc-rules = { path = "../mdc-rules" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
comfy-table = "7"
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
